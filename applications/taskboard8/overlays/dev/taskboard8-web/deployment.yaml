apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard8-web
  labels: &id001
    app: taskboard8-web
    app.kubernetes.io/name: taskboard8-web
    app.kubernetes.io/part-of: taskboard8
    app.kubernetes.io/managed-by: gitops-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskboard8-web
  template:
    metadata:
      labels: *id001
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: ghcr.io/ika100-demo/taskboard8-web
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: NODE_ENV
          value: production
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector:4318
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=taskboard8,deployment.environment=dev
        - name: OTEL_SDK_DISABLED
          value: 'false'
        - name: OTEL_SERVICE_NAME
          value: taskboard8-web
        - name: PORT
          value: '3000'
        - name: TASK_API_URL
          value: http://taskboard8-api
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 3
          failureThreshold: 40
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/ready
            port: http
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          runAsUser: 1000
        volumeMounts:
        - name: next-cache
          mountPath: /app/.next/cache
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: next-cache
        emptyDir: {}
      - name: tmp
        emptyDir: {}
