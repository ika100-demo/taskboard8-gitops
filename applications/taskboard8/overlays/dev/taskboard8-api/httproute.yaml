apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskboard8-api
  labels:
    app: taskboard8-api
    app.kubernetes.io/name: taskboard8-api
    app.kubernetes.io/part-of: taskboard8
    app.kubernetes.io/managed-by: gitops-app
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: kube-system
  hostnames:
  - taskboard8-api.taskboard8-dev.localhost
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: taskboard8-api
      port: 80
